workflows:
  ios-sideloadly:
    name: iOS IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for Sideloadly
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload Amelia-Jaya-unsigned.ipa
    artifacts:
      - build/ios/ipa/Amelia-Jaya-unsigned.ipa
      - build/ios/iphoneos/Runner.app
